# A sample written to be refused, read by `tools/greppable_invariants.py
# --prove` and by nothing else. It sits outside `.github/workflows/`, so no
# forge collects it and nothing here ever runs.
#
# invariant: action-pin-carries-its-version
#
# The defect is on the last line. The action is pinned to a commit, which is
# the half zizmor already refuses when it is absent, and the comment saying
# which release that commit is has been dropped. A reader deciding whether the
# pin is stale has nothing in the file to read.

name: A sample, not a workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
