# The test gate, `test`.
#
# Issue #23 asks for a check that runs the default suite and nothing else, and
# that fails a default-suite test doing any of the three things issue #12
# forbids. The enforcement is not here. It is in `tools/default_suite.py`,
# which is tracked and runs the same way on a contributor's machine as it does
# in this job, so a guard that bites in the runner bites before the push and a
# change to a guard arrives as a diff a reviewer sees.
#
# Two steps and both belong to this check. The first runs the suite under the
# guards. The second is the reason the first is worth anything: every guard has
# a sample written to trip it, and the step refuses a guard no sample trips, a
# sample that has stopped tripping the guard it names, and a sample refused by
# a guard other than its own. A guard that has never been shown to bite is a
# branch nobody has taken. The lint gate carries its rule proofs the same way
# and for the same reason.
#
# No interpreter matrix. This check answers whether the suite passes on the
# floor the package declares; whether it builds on the floor is `oldest
# supported build`, and both read that floor out of the package metadata rather
# than naming a version here.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Read-only: the job reads the tracked tree and writes nothing back.
permissions:
  contents: read

# Cancel a superseded run on the same ref. The suite is cheap and idempotent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Read the declared floor out of the package metadata
        id: floor
        uses: ./.github/actions/declared-floor

      - name: Install the declared floor interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.floor.outputs.version }}

      - name: The default suite passes under the guards
        run: |
          set -euo pipefail
          # Nothing is installed first. The default suite as it stands reads
          # the package metadata and runs the environment report through
          # subprocesses, so it needs the checkout and the interpreter and no
          # dependency. When a test needs numpy this step gains an install and
          # the run stops being one that proves the package imports on a bare
          # interpreter, which is worth noticing at the moment it happens.
          python tools/default_suite.py

      - name: Every guard has a sample that trips it
        run: |
          set -euo pipefail
          # A refusal is the expected outcome for every sample here, so this
          # step reads which guard refused each one rather than only that
          # something failed. A sample refused by the wrong guard is a proof
          # of the wrong thing and is red.
          python tools/default_suite.py --prove
